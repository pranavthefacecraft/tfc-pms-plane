<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>{{ subject }}</title></head>
  <body style="font-family: Arial, sans-serif; color: #333; padding: 24px">
    <p>{{ sender_name }} sent you a message in {{ workspace_name }} on Clevdex.</p>
    <h1 style="font-size: 22px">{{ subject }}</h1>
    <div style="white-space: pre-wrap">{{ body }}</div>
    <p><a href="{{ abs_url }}">Open message in Clevdex</a></p>
    <p>This is a send-only message. Replies to this email are not delivered in Clevdex.</p>
  </body>
</html>
