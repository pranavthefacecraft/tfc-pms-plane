name: Deploy TFC web manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type deploy-web to deploy the selected preview commit"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tfcpms-production-web
  cancel-in-progress: false

jobs:
  validate-build:
    if: github.ref == 'refs/heads/preview' && inputs.confirmation == 'deploy-web'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Run commit-equivalent checks without accepting automatic fixes
        run: |
          pnpm exec lint-staged --diff HEAD^...HEAD
          git diff HEAD --exit-code
      - name: Check web formatting, lint and types
        run: pnpm turbo run check:format check:lint check:types --filter=web
      - name: Run web unit tests
        run: pnpm --filter web exec vitest run --maxWorkers=2
      - name: Build exact release image
        run: |
          docker build --file apps/web/Dockerfile.web \
            --tag "tfcpms/plane-frontend:$GITHUB_SHA" .
          docker save "tfcpms/plane-frontend:$GITHUB_SHA" | gzip > web-image.tar.gz
          sha256sum web-image.tar.gz > web-image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-image-${{ github.sha }}
          path: |
            web-image.tar.gz
            web-image.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-image-${{ github.sha }}
      - name: Verify release artifact
        run: |
          sha256sum --check web-image.tar.gz.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile

          with tarfile.open("web-image.tar.gz", "r:gz") as archive:
              manifest = json.load(archive.extractfile("manifest.json"))
              expected_tag = f"tfcpms/plane-frontend:{os.environ['GITHUB_SHA']}"
              if len(manifest) != 1 or expected_tag not in manifest[0]["RepoTags"]:
                  raise ValueError("Artifact does not contain the expected release")
              config = archive.extractfile(manifest[0]["Config"]).read()
              image_id = "sha256:" + hashlib.sha256(config).hexdigest()
              index = json.load(archive.extractfile("index.json"))
              if len(index["manifests"]) != 1:
                  raise ValueError("Expected a single release manifest")
              manifest_id = index["manifests"][0]["digest"]
              algorithm, digest = manifest_id.split(":")
              if algorithm != "sha256" or len(digest) != 64:
                  raise ValueError("Invalid manifest digest")
              manifest_bytes = archive.extractfile(f"blobs/sha256/{digest}").read()
              if hashlib.sha256(manifest_bytes).hexdigest() != digest:
                  raise ValueError("Manifest checksum mismatch")
              if json.loads(manifest_bytes)["config"]["digest"] != image_id:
                  raise ValueError("Manifest configuration mismatch")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"RELEASE_IMAGE_ID={image_id}\n")
              environment.write(f"RELEASE_MANIFEST_ID={manifest_id}\n")
          PY
      - name: Deploy web with pinned SSH host identity
        env:
          DEPLOY_HOST: ${{ secrets.TFCPMS_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.TFCPMS_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.TFCPMS_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TFCPMS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(
            -i "$ssh_dir/key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"
          image_id="$RELEASE_IMAGE_ID"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          gzip --decompress --stdout web-image.tar.gz |
            ssh "${ssh_options[@]}" "$target" docker load
          ssh "${ssh_options[@]}" "$target" \
            "bash -s -- $GITHUB_SHA $image_id $RELEASE_MANIFEST_ID" < deployments/tfc/deploy-web.sh
